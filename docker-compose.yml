name: ztracs-road-intelligence

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ztracs-postgis
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ztracs
    volumes:
      - ztracs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ztracs"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ztracs_pgdata:
